name: Environment
on:
  workflow_dispatch:

jobs:
  use-dev-secret:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: |
          if [ -n "${{ secrets.DEV_API_KEY }}" ]; then
            echo "DEV_API_KEY present: true"
          else
            echo "DEV_API_KEY present: false"
          fi
        # do NOT print the value — just whether it resolved
